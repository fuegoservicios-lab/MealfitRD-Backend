server {
    server_name bioboros.com www.bioboros.com _;

    # [P2-DEPLOY-ATOMIC 2026-08-14] Un SYMLINK, no el directorio de build.
    #
    # Antes esto era `/opt/mealfit/frontend/dist`, que es donde el deploy corre
    # `npm run build`. Y Vite VACIA el outDir antes de renderizar el primer chunk
    # (plugin `vite:prepare-out-dir`, hook `renderStart`), asi que durante unos
    # segundos de CADA despliegue no existia ni index.html ni assets/: el
    # fallback del SPA se quedaba sin destino y las 20 rutas publicas devolvian
    # 404. Con la politica de "commit + deploy con cada mejora", eso pasaba
    # varias veces al dia.
    #
    # Ahora el build sigue ocurriendo en /opt/mealfit/frontend (donde
    # node_modules persiste y el build es rapido) y SOLO al terminar se copia a
    # /var/www/bioboros/releases/<ts>. La publicacion es el cambio del symlink,
    # que nginx resuelve por peticion: no hace falta ni recargar.
    #
    # Rollback = `ln -sfn releases/<anterior> current`. Milisegundos.
    root /var/www/bioboros/current;

    # [P1-LANDING-CANONICAL 2026-08-18] www->apex, barra final, rutas fusionadas.
    include snippets/bioboros-apex-canonical.conf;

    # [P2-SOURCEMAPS-HIDDEN 2026-07-30] Los .map NUNCA se sirven. El deploy los
    # sube a Sentry y los borra de dist/; esto es la segunda barrera por si un
    # build futuro se salta ese paso -- un sourcemap publico expone el fuente
    # con nombres y comentarios originales.

    # ════════════════════════════════════════════════════════════════════
    # EL SITIO ESTÁTICO (bioboros-v2). Añadido al mudar el apex.
    #
    # Captura SOLO las rutas construidas, nombradas una a una. Todo lo demás
    # sigue cayendo en el `location /` de más abajo, que entrega la aplicación
    # React: /novedades, /supermercado, /cookies, /login, /dashboard y
    # cualquier ruta futura siguen funcionando sin enterarse de este cambio.
    #
    # Para revertir la mudanza: borrar este bloque y recargar. El React vuelve
    # a servir la portada al instante, porque nunca dejó de estar ahí.
    # ════════════════════════════════════════════════════════════════════
    # [P2-LANDING-SITEMAP 2026-08-18] Los sirve el LANDING, que es quien sabe
    # que paginas existen. El de React listaba /funciones y /precision, que
    # devuelven 301 desde la canonicalizacion: un sitemap con redirecciones le
    # pide al buscador que indexe lo que tu mismo le dices que no mire.
    location = /sitemap.xml {
        root /var/www/bioboros-v2/current;
        add_header Cache-Control "no-cache";
        try_files /sitemap.xml =404;
    }
    # [P2-LANDING-OBS 2026-08-18] Marcador de release. Sin este location caia al
    # SPA de React, que responde 200 a cualquier ruta: la sonda leia 40 KB de
    # HTML y los daba por buenos como "sha".
    location = /release.txt {
        root /var/www/bioboros-v2/current;
        default_type text/plain;
        add_header Cache-Control "no-cache";
        try_files /release.txt =404;
    }

    location = /robots.txt {
        root /var/www/bioboros-v2/current;
        add_header Cache-Control "no-cache";
        try_files /robots.txt =404;
    }

    location = / {
        root /var/www/bioboros-v2/current;
        add_header Cache-Control "no-cache";
        include snippets/bioboros-v2-security.conf;
        try_files /index.html =404;
    }

    # Los assets del sitio estático viven en /static/ y no en /assets/ a
    # propósito: /assets/ ya es del build de React, y dos raíces distintas para
    # el mismo prefijo es una colisión silenciosa donde el vídeo del héroe
    # devuelve 404.
    location ^~ /static/fonts/ {
        root /var/www/bioboros-v2/current;
        # [P1-CACHE-SOLO-CON-HUELLA 2026-08-19] Ver el map $cache_estatico en
        # nginx.conf: un ano SOLO si la URL trae ?v=<sha>; sin huella, 5 min y
        # revalidar. 14 assets de este sitio no la llevan (fuentes y hero).
        add_header Cache-Control $cache_estatico;
        include snippets/bioboros-v2-security.conf;
        access_log off;
    }
    location ^~ /static/ {
        root /var/www/bioboros-v2/current;
        # [P2-LANDING-CACHE 2026-08-18] 86400 -> immutable. No es optimismo: las
        # URLs de /static/ ya salen con huella `?v=<sha del contenido>` que pone
        # `ver()` en build.py, asi que un cambio de fichero cambia la URL. Con un
        # dia de caducidad, el visitante que vuelve al dia siguiente se
        # redescargaba TODO sin que nada hubiera cambiado (~130 KiB por visita,
        # segun Lighthouse). Las fuentes ya estaban en immutable desde siempre.
        # [P1-CACHE-SOLO-CON-HUELLA 2026-08-19] Ver el map $cache_estatico en
        # nginx.conf: un ano SOLO si la URL trae ?v=<sha>; sin huella, 5 min y
        # revalidar. 14 assets de este sitio no la llevan (fuentes y hero).
        add_header Cache-Control $cache_estatico;
        include snippets/bioboros-v2-security.conf;
    }

    # Rutas limpias sin extensión, con la lista EXPLÍCITA. Una lista explícita y
    # no un comodín: así una ruta nueva del React nunca cae por accidente en el
    # sitio estático y acaba en un 404.
    location ~ ^/(como-funciona|precios|research|motor|about|privacy|terms|medical|data-protection|ai-policy|refunds|acceptable-use|responsible-disclosure|supermercado|novedades)$ {
        root /var/www/bioboros-v2/current;
        add_header Cache-Control "no-cache";
        include snippets/bioboros-v2-security.conf;
        try_files $uri.html =404;
    }

    # La entrada del registro que ya tiene página propia. Va con `=`, que nginx
    # resuelve ANTES que cualquier expresión regular, así que gana al bloque de
    # artículos de aquí abajo sin depender del orden en el fichero.
    #
    # Existe porque en el sitio anterior /novedades/motor-mealfit-v1 era una URL
    # real que redirigía a /motor. Sin esto, la mudanza convertiría en 404 una
    # dirección que estuvo publicada, y un 404 es la peor forma de mudarse.
    location = /novedades/motor-mealfit-v1 { return 301 /motor; }

    # Los artículos del registro. Patrón cerrado (minúsculas, cifras y guiones)
    # y no un comodín: `/novedades/` con cualquier cosa detrás acabaría pidiendo
    # ficheros del disco por nombre, y eso es una superficie que no hace falta
    # abrir para servir dos artículos.
    location ~ ^/novedades/[a-z0-9-]+$ {
        root /var/www/bioboros-v2/current;
        add_header Cache-Control "no-cache";
        include snippets/bioboros-v2-security.conf;
        try_files $uri.html =404;
    }

    location ~ \.map$ { return 404; }

    index index.html;

    client_max_body_size 25M;

    # ---- Headers de seguridad (migrados de vercel.json) ----
    include snippets/mealfit-security.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    # [P2-INFRA-EDGE-SSOT 2026-08-14] Nivel explicito. Sin esta linea nginx usa el
    # default, que es 1 -- el mas rapido y el que menos comprime. Medido sobre el
    # bundle de hoy: el chunk de entrada baja de 98.140 a 84.698 B y vendor-react
    # de 81.967 a 70.093. Sobre el critical path del landing son ~30 KB por visita
    # a cambio de unos milisegundos de CPU en un ARM que esta al 0% de carga.
    # No se sube mas: de 6 a 9 el ratio mejora poco y el coste de CPU se dispara.
    gzip_comp_level 6;

    # [P3-BROTLI · 2026-08-19] Brotli junto a gzip, no en su lugar.
    #
    # Medido sobre los assets reales de esta release: brotli ahorra un 14,1%
    # frente a gzip-6 (el conjunto que bloquea el primer pintado baja de 147,6 a
    # 127,6 kB). No es espectacular; es gratis y se nota en una conexion mala.
    #
    # Los modulos son los EMPAQUETADOS POR UBUNTU (libnginx-mod-http-brotli-*),
    # no un ngx_brotli compilado a mano: asi suben con nginx en el mismo apt y no
    # existe el modo de fallo de que un upgrade desatendido deje un modulo con la
    # ABI vieja y nginx no arranque. Ese riesgo era el motivo de no ponerlo antes.
    #
    # gzip SE QUEDA: un cliente que no anuncia `br` —y los hay— tiene que seguir
    # recibiendo algo comprimido. `gzip_vary on` de arriba ya emite
    # `Vary: Accept-Encoding`, que es lo que impide que una cache intermedia le
    # sirva brotli a quien no lo entiende.
    #
    # Nivel 5 y no 11: 11 es para pre-comprimir en disco, no para comprimir en
    # cada peticion. `brotli_static on` sirve un .br ya hecho si algun dia se
    # generan en el build; mientras no existan, es inerte.
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_static on;
    brotli_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ---- API → backend FastAPI (incluye SSE streaming) ----
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE / long-running plan generation: sin buffering, timeouts largos
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Endpoints de salud/ops → backend ----
    location = /health      { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; }
    location /health/       { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; }
    location = /ready       { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; }

    # ---- Service worker: nunca cachear (debe actualizarse) ----
    location = /custom-sw.js {
        # [MUDANZA DEL APEX] Sirve el INTERRUPTOR DE APAGADO del sitio
        # estático, no el service worker del build de React. Sin esto, un
        # visitante que ya conocía el sitio seguiría viendo la portada vieja
        # desde su propia caché por muy bien que el servidor sirva la nueva.
        root /var/www/bioboros-v2/current;
        add_header Cache-Control "no-cache";
        include snippets/bioboros-v2-security.conf;
        try_files $uri =404;
    }

    # ---- index.html: no cachear (para que despliegues nuevos se vean) ----
    #
    # [P2-INFRA-EDGE-SSOT 2026-08-14] Era `location = /index.html`, coincidencia
    # EXACTA. Eso bastaba mientras existiera un solo HTML, pero deja fuera a
    # cualquier `dist/<ruta>/index.html` -- justo lo que produce el prerender de
    # meta por ruta. Un HTML de esos SIN `no-cache` es el peor caso posible: el
    # navegador se queda con una copia que referencia hashes de assets que el
    # siguiente deploy ya borro, y el usuario ve una pagina rota hasta que limpia
    # cache a mano. La regex cubre `/index.html` y `/<lo-que-sea>/index.html`.
    # [P1-APEX-404 2026-08-18] En el apex, `/index.html` era la portada por
    # otra direccion Y con otra politica de seguridad. Un 301 y se acaba.
    location = /index.html {
        # El snippet va AQUI aunque solo sea un 301: nginx no hereda
        # `add_header` a una location, asi que sin esto la redireccion salia
        # con la politica de la APP y era la unica URL del apex con una CSP
        # distinta a las demas. Una respuesta sin cuerpo tambien es una
        # respuesta.
        include snippets/bioboros-v2-security.conf;
        return 301 https://bioboros.com/;
    }

    # ---- Assets con hash: cache largo e inmutable ----
    location /assets/ {
        # [P2-CACHE-CLASES 2026-08-18] Sin `expires`: emitia su propio
        # `Cache-Control: max-age=31536000` ADEMAS del de abajo, asi que la
        # respuesta salia con DOS cabeceras `Cache-Control` distintas y una cache
        # intermedia no tiene por que elegir la que tu quieres. Medido en vivo.
        # `max-age` explicito aqui, que antes lo ponia el `expires`.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/mealfit-security.conf;
        try_files $uri =404;
    }

    # ---- SPA fallback ----
    #
    # [P2-LANDING-PRERENDER-META 2026-08-14] `$uri/index.html`, NO `$uri/`.
    #
    # Con `$uri/`, nginx encuentra el DIRECTORIO `precios/` que crea el prerender
    # y emite un 301 a `/precios/` (su redirect de barra final). Medido en vivo:
    # `GET /precios` devolvia `301 -> /precios/`. Funcionaba —el contenido estaba
    # detras— pero cobraba un salto extra a cada enlace interno y dejaba la URL
    # servida (`/precios/`) distinta de la canonica que el propio HTML declara
    # (`/precios`), que es justo la incoherencia que el prerender venia a cerrar.
    #
    # Pidiendo el fichero explicitamente, nginx lo sirve sin redirigir.
    location / {
        # [P2-LANDING-PRERENDER-META 2026-08-14] Estas dos lineas NO son opcionales,
        # y la razon es sutil. Con el `try_files` de arriba, nginx sirve el HTML
        # DENTRO de esta location; antes, `$uri/` hacia un redirect interno que
        # acababa en `location ~ /index\.html$` y de ahi salia el `no-cache`.
        # Medido tras el cambio: `/` empezo a responder SIN Cache-Control, o sea
        # cacheable -- el fallo que hace que un usuario siga sirviendo el bundle
        # viejo tras cada despliegue.
        add_header Cache-Control "no-cache" always;
        # ⚠️ Y por eso hace falta el snippet AQUI: nginx no hereda `add_header` a
        # una location que define los suyos (lo dice la cabecera del propio
        # snippet). Sin esta linea, la de arriba se habria llevado por delante los
        # 6 headers de seguridad de TODAS las paginas HTML del sitio.
        include snippets/bioboros-v2-security.conf;
        # [P1-APEX-404 2026-08-18] EL APEX DEJA DE SERVIR EL SPA COMO COMODIN.
        #
        # Antes acababa en el `/index.html` de React, asi que CUALQUIER direccion
        # inexistente respondia 200 con la aplicacion. Dos consecuencias medidas:
        #   - soft-404: un buscador indexa "paginas" que no existen, y un fichero
        #     que falta se sirve como si existiera (asi una sonda mia dio por
        #     bueno un "release.txt" que en realidad eran 40 KB de HTML).
        #   - DOS politicas de seguridad en el MISMO host: `/` y `/precios` con la
        #     del landing, `/index.html` y lo desconocido con la de la app.
        #
        # Orden ahora: sitio estatico -> ficheros REALES del dist de React
        # (favicon, og-image, .well-known/security.txt) -> 404 de verdad.
        # `@publico_react` usa `try_files $uri =404`, SIN caer a index.html:
        # sirve lo que existe y nada mas. Ahi esta toda la diferencia.
        root /var/www/bioboros-v2/current;
        try_files $uri $uri.html @publico_react;
    }

    location @publico_react {
        root /var/www/bioboros/current;
        add_header Cache-Control "no-cache" always;
        include snippets/bioboros-v2-security.conf;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /var/www/bioboros-v2/current;
        add_header Cache-Control "no-cache" always;
        include snippets/bioboros-v2-security.conf;
        internal;
    }

    # [P2-EDGE-HTTP2 · 2026-08-15] HTTP/2. Lo encontro la PRIMERA traza real de LCP
    # del proyecto (Chrome DevTools, Slow 4G + CPU 4x, contra produccion): TODAS las
    # respuestas salian por `http/1.1`. nginx 1.24 lo soporta; solo no estaba puesto.
    #
    # Por que importa aqui mas que en un sitio cualquiera: el critical path del apex
    # son 23 recursos, y P2-LANDING-OLA1-DIET partio lucide en ~12 chunks de icono
    # de 150-300 B cada uno. Ese reparto se justifico como "barato sobre HTTP/2" --
    # y el sitio no estaba en HTTP/2. Con 1.1 son 6 conexiones por origen y
    # head-of-line blocking: exactamente el caso que la multiplexacion resuelve.
    #
    # ⚠️ EL `http2` VA SOLO EN ESTE BLOQUE, Y NO ES ESTETICA. En nginx < 1.25.1 el
    # parametro es del `listen`, y aplica a la pareja direccion:puerto COMPLETA.
    # Repetirlo en otro `server` que escuche el mismo 443 (los hay: app.bioboros.com
    # en :315, y los dos de mealfitrd.com) da `duplicate listen options for
    # 0.0.0.0:443` y nginx NO ARRANCA. Este bloque es el primero del fichero que
    # declara :443 e [::]:443, asi que es el que manda para todos.
    #
    # Al subir a nginx >= 1.25.1 esto se migra a la directiva `http2 on;` dentro de
    # cada server, y entonces SI va en todos.
    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bioboros.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bioboros.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = api.mealfitrd.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.mealfitrd.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = mealfitrd.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bioboros.com www.bioboros.com _;

    # [BIOBOROS-MIGRATION 2026-07-30] Excepcion ACME. Este bloque :80 es
    # default_server con server_name _ , asi que captura CUALQUIER host que
    # resuelva a esta IP y devolvia 404 a todo -- incluido el challenge de
    # Let's Encrypt, lo que hacia imposible validar por webroot. Es aditiva:
    # va ANTES del return 404, no lo sustituye, y sirve para todos los hosts
    # presentes y futuros. Tambien deja resueltas las RENOVACIONES.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    # [BIOBOROS-MIGRATION 2026-07-30] Era `return 404;` a nivel de server. Un
    # `return` de servidor corre en la fase REWRITE, ANTES del matching de
    # location, asi que cortocircuitaba el bloque ACME de arriba y lo dejaba
    # inerte. Bajarlo a `location /` preserva el 404 para todo lo demas y deja
    # que el `^~` del challenge gane por especificidad.
    # [P1-LANDING-HOST-REFLECTION · 2026-08-18] El :80 deja de reflejar `Host`.
    #
    # Este fragmento SUSTITUYE al `location / { return 301 https://$host$request_uri; }`
    # del server `listen 80 default_server` de `sites-enabled/mealfit`.
    #
    # ─────────────────────────────────────────────────────────────────────────────
    # EL FALLO, reproducido en producción
    # ─────────────────────────────────────────────────────────────────────────────
    #     curl -H "Host: attacker.example" http://bioboros.com/
    #     HTTP/1.1 301 Moved Permanently
    #     Location: https://attacker.example/
    #
    # El bloque es `default_server` con `server_name bioboros.com www.bioboros.com _`,
    # así que acepta CUALQUIER Host, y `$host` sale del encabezado que manda quien
    # llama. Devolverlo dentro de `Location` convierte el dominio en un redirector
    # abierto: un enlace que empieza en bioboros.com y termina donde el atacante
    # quiera. Sirve para phishing —la víctima ve un dominio de confianza en el que
    # hace clic— y para envenenar cachés intermedias.
    #
    # ─────────────────────────────────────────────────────────────────────────────
    # EL ARREGLO, y por qué no es «quitar el `_`»
    # ─────────────────────────────────────────────────────────────────────────────
    # Quitar el `_` a secas dejaría sin `default_server` al puerto 80, y entonces
    # nginx elegiría el PRIMER server como destino de los hosts desconocidos: el
    # mismo problema con otro dueño. Lo que cierra el agujero es no volver a poner
    # `$host` en `Location` nunca: cada host conocido lleva su destino ESCRITO, y lo
    # que no está en la lista no recibe redirección.
    #
    # La lista sale de los `server_name` que este nginx declara de verdad
    # (`grep -rhoE "server_name +[^;]+;" /etc/nginx/sites-enabled/`), no de memoria.
    # Si mañana nace un subdominio, se añade aquí; mientras no esté, no se le
    # redirige a ninguna parte, que es el fallo seguro correcto.
    #
    # 444 y no 404: cierra la conexión sin responder. A un cliente que llega con un
    # Host que este servidor no sirve no hay nada que contarle, y una respuesta con
    # cuerpo es superficie que no hace falta.

    location / {
        set $destino_https "";

        if ($host = bioboros.com)       { set $destino_https "https://bioboros.com"; }
        if ($host = www.bioboros.com)   { set $destino_https "https://bioboros.com"; }
        if ($host = app.bioboros.com)   { set $destino_https "https://app.bioboros.com"; }
        if ($host = mealfitrd.com)      { set $destino_https "https://mealfitrd.com"; }
        if ($host = www.mealfitrd.com)  { set $destino_https "https://www.mealfitrd.com"; }
        if ($host = app.mealfitrd.com)  { set $destino_https "https://app.mealfitrd.com"; }
        if ($host = api.mealfitrd.com)  { set $destino_https "https://api.mealfitrd.com"; }

        if ($destino_https = "") { return 444; }

        return 301 $destino_https$request_uri;
    }
}

# ============================================================================
# [P3-APP-SUBDOMAIN · 2026-06-28] app.mealfitrd.com — la APP (login + dashboard).
# Fase 1: sirve el MISMO dist que mealfitrd.com. noindex + robots Disallow para
# que Google NO lo indexe (la versión indexable es el apex mealfitrd.com).
# Fase 2 (futuro): build separado + redirects. El bloque 443/SSL lo añade certbot.
# ============================================================================
server {
    server_name app.bioboros.com;

    # [P1-LEGAL-UNA-SOLA-COPIA . 2026-08-19] Las 16 paginas publicas viven en el
    # apex, y solo ahi.
    #
    # La app las servia TAMBIEN --su propio /privacy, /terms, /precios...-- porque
    # el catch-all del SPA devuelve el armazon para cualquier ruta. No era un
    # espejo: era un sitio de marketing CONGELADO en el diseno anterior, con el
    # nav viejo (Funciones, Precision, Investigacion) enlazando a rutas que en el
    # apex son 301, 301 y 404, y el CTA de la era pasada.
    #
    # Y el texto legal era una copia paralela sin nada que la sincronizara. El
    # precio ya se pago: el 19 de agosto la misma afirmacion falsa sobre
    # contrasenas --que decia proteger una que no existe-- vivia en TRES sitios, y
    # corregir uno solo habria movido la contradiccion en vez de cerrarla.
    #
    # 301 y no 302: es permanente, y asi los buscadores dejan de indexar dos
    # versiones del mismo contrato. `$request_uri` preserva la ruta y la query.
    #
    # NO toca las rutas de la aplicacion (/login, /register, /reset-password,
    # /assessment, /plan, /configuracion, /dashboard, /history): ninguna aparece
    # en esta lista, que sale del sitemap del apex.
    location ~ ^/(about|acceptable-use|ai-policy|como-funciona|data-protection|medical|motor|novedades|precios|privacy|refunds|research|responsible-disclosure|supermercado|terms)(/.*)?$ {
        return 301 https://bioboros.com$request_uri;
    }

    # [P2-RUTAS-HUERFANAS-APP . 2026-08-23] Las TRES que la lista de arriba NO podia
    # cubrir, y por que la lista no basta.
    #
    # Esa lista sale del sitemap del apex, asi que solo cubre rutas que existen ALLI
    # con el MISMO nombre. Medido con curl contra produccion (no inferido): de las 19
    # rutas de papel, 15 daban 301 y estas tres daban 200, sirviendo el React
    # congelado que el comentario de arriba ya describe. El propio comentario nombra
    # "el nav viejo (Funciones, Precision, Investigacion)" -- o sea que se sabia que
    # esas paginas existian, pero cerrarlas exigia un renombre y la lista solo sabe
    # hacer passthrough con `$request_uri`.
    #
    # `/cookies` es el que mas pesa, y es el que casi se escapa: devolvia 200 con el
    # <title> del LOGIN ("Bioboros - Inicia sesion y administra tu plan") en una
    # direccion que es una politica legal. Para una PERSONA el rodeo terminaba bien
    # (el SPA arranca y React la manda a /privacy, que si redirige), y por eso no
    # duele al usarlo; el dano es para quien NO ejecuta JavaScript -- un buscador o
    # la vista previa de un enlace ven el HTML servido, no el resultado de correrlo.
    # El apex ya resuelve esta misma direccion con 301 a /privacy#cookies (P3-COOKIES-MERGE:
    # la politica se fusiono en Privacidad, seccion 13); aqui se replica ese destino.
    #
    # COMILLAS OBLIGATORIAS en el destino de /cookies: en nginx `#` abre un comentario,
    # asi que sin comillas el fragmento se pierde EN SILENCIO y la regla parece correcta.
    #
    # `/?$` y no `$`: la forma con barra final tambien llega, y sin ella caeria en el
    # catch-all del SPA -- que es exactamente el agujero que estas tres lineas cierran.
    location ~ ^/funciones/?$ { return 301 https://bioboros.com/como-funciona; }
    location ~ ^/precision/?$ { return 301 https://bioboros.com/research; }
    location ~ ^/cookies/?$   { return 301 "https://bioboros.com/privacy#cookies"; }

    # [P3-APP-SUBDOMAIN-INDEXABLE - 2026-06-28] App indexable con identidad SEO
    # propia (self-canonical + title/desc de login) para aparecer en Google como
    # resultado distinto del apex. sub_filter reescribe el HTML del dist SOLO en
    # este host (el dist fisico es el mismo que el apex).
    sub_filter_once on;
    sub_filter '<title>Bioboros | Nutrición Personalizada con IA</title>' '<title>Bioboros — Inicia sesión y administra tu plan</title>';
    sub_filter '<link rel="canonical" href="https://bioboros.com/" />' '<link rel="canonical" href="https://app.bioboros.com/" />';
    sub_filter '<meta name="description" content="Planes de alimentación 100% personalizados con IA avanzada. Adaptados a tus gustos, presupuesto y estilo de vida. Comienza gratis." />' '<meta name="description" content="Entra a tu cuenta Bioboros para ver y ajustar tu plan de alimentación personalizado con IA." />';

    # [P2-DEPLOY-ATOMIC 2026-08-14] Un SYMLINK, no el directorio de build.
    #
    # Antes esto era `/opt/mealfit/frontend/dist`, que es donde el deploy corre
    # `npm run build`. Y Vite VACIA el outDir antes de renderizar el primer chunk
    # (plugin `vite:prepare-out-dir`, hook `renderStart`), asi que durante unos
    # segundos de CADA despliegue no existia ni index.html ni assets/: el
    # fallback del SPA se quedaba sin destino y las 20 rutas publicas devolvian
    # 404. Con la politica de "commit + deploy con cada mejora", eso pasaba
    # varias veces al dia.
    #
    # Ahora el build sigue ocurriendo en /opt/mealfit/frontend (donde
    # node_modules persiste y el build es rapido) y SOLO al terminar se copia a
    # /var/www/bioboros/releases/<ts>. La publicacion es el cambio del symlink,
    # que nginx resuelve por peticion: no hace falta ni recargar.
    #
    # Rollback = `ln -sfn releases/<anterior> current`. Milisegundos.
    root /var/www/bioboros/current;

    # [P2-SOURCEMAPS-HIDDEN 2026-07-30] Los .map NUNCA se sirven. El deploy los
    # sube a Sentry y los borra de dist/; esto es la segunda barrera por si un
    # build futuro se salta ese paso -- un sourcemap publico expone el fuente
    # con nombres y comentarios originales.
    location ~ \.map$ { return 404; }

    index index.html;

    client_max_body_size 25M;

    include snippets/mealfit-security.conf;
    # App subdomain: NO indexar (la versión SEO vive en el apex mealfitrd.com).

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    # [P2-INFRA-EDGE-SSOT 2026-08-14] Nivel explicito. Sin esta linea nginx usa el
    # default, que es 1 -- el mas rapido y el que menos comprime. Medido sobre el
    # bundle de hoy: el chunk de entrada baja de 98.140 a 84.698 B y vendor-react
    # de 81.967 a 70.093. Sobre el critical path del landing son ~30 KB por visita
    # a cambio de unos milisegundos de CPU en un ARM que esta al 0% de carga.
    # No se sube mas: de 6 a 9 el ratio mejora poco y el coste de CPU se dispara.
    gzip_comp_level 6;

    # [P3-BROTLI · 2026-08-19] Brotli junto a gzip, no en su lugar.
    #
    # Medido sobre los assets reales de esta release: brotli ahorra un 14,1%
    # frente a gzip-6 (el conjunto que bloquea el primer pintado baja de 147,6 a
    # 127,6 kB). No es espectacular; es gratis y se nota en una conexion mala.
    #
    # Los modulos son los EMPAQUETADOS POR UBUNTU (libnginx-mod-http-brotli-*),
    # no un ngx_brotli compilado a mano: asi suben con nginx en el mismo apt y no
    # existe el modo de fallo de que un upgrade desatendido deje un modulo con la
    # ABI vieja y nginx no arranque. Ese riesgo era el motivo de no ponerlo antes.
    #
    # gzip SE QUEDA: un cliente que no anuncia `br` —y los hay— tiene que seguir
    # recibiendo algo comprimido. `gzip_vary on` de arriba ya emite
    # `Vary: Accept-Encoding`, que es lo que impide que una cache intermedia le
    # sirva brotli a quien no lo entiende.
    #
    # Nivel 5 y no 11: 11 es para pre-comprimir en disco, no para comprimir en
    # cada peticion. `brotli_static on` sirve un .br ya hecho si algun dia se
    # generan en el build; mientras no existan, es inerte.
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_static on;
    brotli_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # robots.txt propio del subdominio.
    #
    # [P2-INFRA-EDGE-SSOT 2026-08-14] El `Sitemap:` apuntaba a
    # `https://app.mealfitrd.com/app-sitemap.xml` -- el dominio ANTERIOR al
    # rebrand, que ya no sirve el sitio. Un crawler que siguiera esa pista no
    # encontraba nada. Corregido a bioboros.com.
    #
    # ⚠️ DISCREPANCIA PENDIENTE DE DECISION, no tocada aqui: el comentario decia
    # "bloquea TODO el rastreo" y el contenido dice `Allow: /` con una lista de
    # Disallow. Son cosas distintas, y cual de las dos es la intencion real es
    # una decision de SEO (¿se indexa algo de app.bioboros.com o no?), no un
    # error tipografico que corregir de oficio.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /dashboard\nDisallow: /assessment\nDisallow: /plan\nDisallow: /reset-password\nDisallow: /configuracion\nDisallow: /history\n\nSitemap: https://app.bioboros.com/app-sitemap.xml\n";
    }

    # ---- API → backend FastAPI (incluye SSE streaming) ----
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Endpoints de salud/ops → backend ----
    location = /health      { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; }
    location /health/       { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; }
    location = /ready       { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; }

    # ---- Service worker: nunca cachear ----
    location = /custom-sw.js {
        add_header Cache-Control "no-cache";
        include snippets/mealfit-security.conf;
        try_files $uri =404;
    }

    # ---- index.html: no cachear ----
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/mealfit-security.conf;
        try_files $uri =404;
    }

    # ---- Assets con hash: cache largo e inmutable ----
        # ── [P2-CACHE-CLASES 2026-08-18] Cache por CLASE de recurso ──────────────
    #
    # Medido antes: fuentes, favicon, apple-touch-icon, og-image y manifest.json
    # salian con `no-cache` porque caian en `location /`. La peor era la fuente:
    # `/fonts/<hash>.woff2` tiene nombre OPACO —no cambia nunca— y aun asi el
    # navegador la revalidaba en cada visita.
    #
    # Sin `expires`: emite su PROPIO `Cache-Control` y junto al `add_header`
    # salian DOS cabeceras contradictorias en la misma respuesta (medido:
    # `max-age=31536000` y `public, max-age=31536000, immutable`). Una cache
    # intermedia no tiene por que elegir la que tu quieres.
    #
    # La regla del audit, respetada al pie: `immutable` SOLO para nombres
    # versionados. Un nombre sin version cacheado un ano es una bomba de
    # relojeria: el dia que cambie el contenido no hay forma de invalidarlo.
    location ^~ /fonts/ {
        # Nombre con hash de contenido (estilo Google Fonts): si cambia la
        # fuente, cambia el fichero. Seguro para un ano.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/mealfit-security.conf;
        access_log off;
        try_files $uri =404;
    }

    location ~* -v\d+\.(png|jpg|jpeg|webp|svg)$ {
        # Versionados a mano (`apple-touch-icon-v2.png`, `og-image-v4.jpg`).
        # Llevan version en el NOMBRE justo porque iOS y los unfurlers ignoran
        # el `?v=`, asi que son igual de seguros que un hash.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/mealfit-security.conf;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        # Sin version en el nombre: caducidad corta y revalidacion. Ni `no-cache`
        # (redescarga inutil) ni `immutable` (imposible de invalidar).
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        include snippets/mealfit-security.conf;
        try_files $uri =404;
    }

    location ~* ^/(manifest\.json|robots\.txt|app-sitemap\.xml|sitemap\.xml)$ {
        # Documentos que se actualizan: TTL corto y revalidacion.
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        include snippets/mealfit-security.conf;
        try_files $uri =404;
    }

    location /assets/ {
        # [P2-CACHE-CLASES 2026-08-18] Sin `expires`: emitia su propio
        # `Cache-Control: max-age=31536000` ADEMAS del de abajo, asi que la
        # respuesta salia con DOS cabeceras `Cache-Control` distintas y una cache
        # intermedia no tiene por que elegir la que tu quieres. Medido en vivo.
        # `max-age` explicito aqui, que antes lo ponia el `expires`.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/mealfit-security.conf;
        try_files $uri =404;
    }

    # ---- SPA fallback ----
    #
    # [P2-LANDING-PRERENDER-META 2026-08-14] `$uri/index.html`, NO `$uri/`.
    #
    # Con `$uri/`, nginx encuentra el DIRECTORIO `precios/` que crea el prerender
    # y emite un 301 a `/precios/` (su redirect de barra final). Medido en vivo:
    # `GET /precios` devolvia `301 -> /precios/`. Funcionaba —el contenido estaba
    # detras— pero cobraba un salto extra a cada enlace interno y dejaba la URL
    # servida (`/precios/`) distinta de la canonica que el propio HTML declara
    # (`/precios`), que es justo la incoherencia que el prerender venia a cerrar.
    #
    # Pidiendo el fichero explicitamente, nginx lo sirve sin redirigir.
    location / {
        # [P2-LANDING-PRERENDER-META 2026-08-14] Estas dos lineas NO son opcionales,
        # y la razon es sutil. Con el `try_files` de arriba, nginx sirve el HTML
        # DENTRO de esta location; antes, `$uri/` hacia un redirect interno que
        # acababa en `location ~ /index\.html$` y de ahi salia el `no-cache`.
        # Medido tras el cambio: `/` empezo a responder SIN Cache-Control, o sea
        # cacheable -- el fallo que hace que un usuario siga sirviendo el bundle
        # viejo tras cada despliegue.
        add_header Cache-Control "no-cache" always;
        # ⚠️ Y por eso hace falta el snippet AQUI: nginx no hereda `add_header` a
        # una location que define los suyos (lo dice la cabecera del propio
        # snippet). Sin esta linea, la de arriba se habria llevado por delante los
        # 6 headers de seguridad de TODAS las paginas HTML del sitio.
        include snippets/mealfit-security.conf;
        try_files $uri $uri/index.html /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.bioboros.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.bioboros.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = app.mealfitrd.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name app.bioboros.com;
    # [BIOBOROS-MIGRATION 2026-07-30] Era un `return 404;` a NIVEL DE SERVER.
    # Mismo defecto que ya se habia corregido en el bloque :80 por defecto,
    # repetido en su BLOQUE HERMANO: un `return` de servidor corre en la fase
    # rewrite y cortocircuita el matching de `location`. Dos consecuencias:
    #   (a) http://app.bioboros.com devolvia 404 en vez de redirigir a https;
    #   (b) mas grave y silenciosa: el challenge ACME caia en ese mismo 404,
    #       asi que la RENOVACION del certificado de app.bioboros.com habria
    #       fallado sin avisar al vencer (2026-10-28).
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }


}
# ===========================================================================
# [P1-DOMAIN-CUTOVER-BIOBOROS · 2026-07-30] mealfitrd.com -> bioboros.com.
# El dominio viejo NO se mantiene a largo plazo (decision del owner), pero
# sigue sirviendo el 301 mientras los usuarios migran. Sus certificados
# permanecen: sin TLS valido el navegador aborta antes de leer la redireccion.
# ===========================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mealfitrd.com www.mealfitrd.com api.mealfitrd.com;
    ssl_certificate /etc/letsencrypt/live/mealfitrd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mealfitrd.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://bioboros.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.mealfitrd.com;
    ssl_certificate /etc/letsencrypt/live/app.mealfitrd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.mealfitrd.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://app.bioboros.com$request_uri; }
}
