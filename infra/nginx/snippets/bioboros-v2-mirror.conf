# Cabeceras de v2.bioboros.com, el ESPEJO DE PRUEBAS del apex.
#
# Sirve exactamente la misma carpeta que bioboros.com, así que hay que decirle a
# los buscadores que el original es el apex. El HTML no puede llevar la marca:
# es literalmente el mismo fichero, y ahí sí tiene que indexarse.
#
# Va en un envoltorio y no en el server block porque nginx NO hereda `add_header`
# a un `location` que define los suyos, y todos los de aquí declaran su propio
# Cache-Control. Es la misma regla que ya documenta el snippet de la aplicación.
include snippets/bioboros-v2-security.conf;
add_header X-Robots-Tag "noindex, nofollow" always;
