# [P1-LANDING-CANONICAL · 2026-08-18] Canonicalización del apex + cierre del
# reflejo de `Host`. Este fichero se INCLUYE desde el server HTTPS de
# bioboros.com; el bloque :80 se parchea aparte (ver infra/README.md).
#
# ─────────────────────────────────────────────────────────────────────────────
# 1 · www → apex
# ─────────────────────────────────────────────────────────────────────────────
# `www.bioboros.com` servía CONTENIDO en vez de redirigir, así que cada página
# existía en dos direcciones distintas. Para un buscador son dos sitios que se
# hacen la competencia entre sí con el mismo texto.
if ($host = www.bioboros.com) { return 301 https://bioboros.com$request_uri; }

# ─────────────────────────────────────────────────────────────────────────────
# 2 · La barra final: una sola dirección canónica
# ─────────────────────────────────────────────────────────────────────────────
# Medido antes del arreglo:
#     /precios   -> 200, 18.894 bytes  (el sitio estático)
#     /precios/  -> 200, 26.175 bytes  (¡el SPA de React!)
#
# O sea que no era «la misma página con y sin barra»: eran DOS SITIOS DISTINTOS
# bajo direcciones que cualquiera consideraría la misma, y las 16 rutas
# interiores tenían el mismo problema. La versión con barra ni siquiera es el
# contenido que el `<link rel="canonical">` de la propia página declara.
#
# La forma canónica es SIN barra, que es la que emite el sitio y la que declara
# el canonical. Un solo salto, preservando la query.
location ~ ^/(index|about|acceptable-use|ai-policy|como-funciona|data-protection|medical|motor|novedades|precios|privacy|refunds|research|responsible-disclosure|supermercado|terms)/$ {
    return 301 https://bioboros.com/$1$is_args$args;
}

# ─────────────────────────────────────────────────────────────────────────────
# 3 · Las rutas que se fusionaron, y que seguían vivas por su cuenta
# ─────────────────────────────────────────────────────────────────────────────
# `/funciones` y `/precision` se fundieron en `/como-funciona`, pero las dos
# seguían devolviendo 200 sirviendo React: contenido duplicado y, peor, dos
# páginas que ya nadie mantiene. Se mandan a la sección correspondiente.
# `/cookies` vive dentro de la política de privacidad.
location = /funciones  { return 301 https://bioboros.com/como-funciona#funciones; }
location = /precision  { return 301 https://bioboros.com/como-funciona#precision; }
location = /cookies    { return 301 https://bioboros.com/privacy#cookies; }
