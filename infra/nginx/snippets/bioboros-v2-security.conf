# Cabeceras de seguridad de v2.bioboros.com.
#
# POR QUÉ NO USA `snippets/mealfit-security.conf`, que es el SSOT de la app.
#
# Ese snippet lleva una CSP Report-Only escrita para la aplicación React, con
# `report-uri` a Sentry. Esta página es estática y reproduce su vídeo desde una
# URL `blob:` (se descarga entero y se sirve como objeto local, que es lo que
# hace que el scroll pueda saltar a cualquier punto). La Report-Only de la app
# no declara `media-src`, así que ese blob cae a `default-src 'self'` y se
# reporta como violación EN CADA VISITA. Medido: la primera carga en vivo hizo
# una petición a `o4511722960781312.ingest.us.sentry.io`.
#
# Ensuciar la telemetría de seguridad de la app con falsos positivos de una
# página que no es la app es peor que no reportar nada: entrena a quien la mire
# a ignorar el canal.
#
# Las seis cabeceras obligatorias de abajo son COPIA EXACTA de las suyas. Lo
# único que cambia es la CSP, que aquí no es de observación sino APLICADA: esta
# página se controla entera, se verificó en navegador real y no carga un solo
# recurso de terceros, así que puede permitirse una política estricta de verdad
# en vez de una en modo aviso.
#
# Si un día se toca el snippet compartido, este fichero NO se entera. Es el
# precio aceptado a cambio de no meter ruido en el canal de la app.
# [P2-CSP-REPORTE . 2026-08-19] `report-uri` en la politica IMPUESTA del apex.
#
# El comentario de arriba explica por que este host NO usa el snippet de la app:
# aquella CSP Report-Only no declara `media-src`, asi que el video servido desde
# una URL `blob:` caia a `default-src 'self'` y se reportaba como violacion EN
# CADA VISITA.
#
# Esa razon NO se aplica a esta politica, que si declara `media-src 'self' blob:`.
# Medido antes de anadir nada, con un navegador de verdad sobre /, /precios,
# /supermercado y /novedades: CERO violaciones. Reportar sin ruido es
# observabilidad; reportar con ruido entrena a ignorar el canal, que es
# exactamente lo que aquel comentario evito.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-elem 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; report-uri https://o4511722960781312.ingest.us.sentry.io/api/4511722995384320/security/?sentry_key=4b132788bcca5aaff5273e31c919be60" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
