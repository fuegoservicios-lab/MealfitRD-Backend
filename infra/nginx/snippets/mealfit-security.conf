# Headers de seguridad (migrados de vercel.json — defensa en profundidad).
# Incluido en el server block HTTPS y en cada location con add_header propio
# (nginx no hereda add_header a un location que define los suyos).
#
# [P2-CSP-ENFORCE · 2026-08-14 · MOVIMIENTO 1 de 3] Debajo conviven DOS CSP y no
# es un error:
#
#   1. Una ENFORCED con las directivas que NO pueden romper nada porque no
#      dependen de terceros ni de cómo se cargan los scripts. Bloquean el robo
#      de formularios, la reescritura de la base de URLs, los plugins y el
#      clickjacking — hoy, de verdad, sin periodo de observación.
#   2. La Report-Only de siempre, INTACTA, que sigue cubriendo `script-src` y
#      `style-src`. Esas dos son las delicadas y se prometen para después.
#
# Un navegador aplica ambas por separado: una petición se bloquea si CUALQUIERA
# de las enforced la prohíbe, y las violaciones de la Report-Only sólo se
# reportan. Convivir es el modo soportado, no un truco.
#
# `form-action` incluye PayPal a propósito: el checkout puede hacer un submit
# clásico a su dominio, y una CSP que rompe el pago sería peor que no tenerla.
#
# LO QUE FALTA (movimientos 2 y 3, en este orden):
#   2. Un COLECTOR. La Report-Only lleva desde mayo sin `report-uri`/`report-to`,
#      o sea tres meses sin producir un solo dato — y el paso 1 del runbook es
#      «observa una semana», que sin colector no puede ni empezar. Necesita una
#      URL de ingesta de Sentry que hay que sacar del panel del proyecto.
#   3. `script-src` a enforce, con el hash del bloque inline de index.html
#      GENERADO en el deploy a partir de `dist/index.html`, nunca fijado a mano:
#      un hash viejo en enforce impide ejecutar el boot del tema y devuelve el
#      flash oscuro→papel a las 19 rutas.
#      ⚠️ `style-src` NO puede ser hash-only mientras sonner inyecte su CSS en
#      runtime (`__insertCSS`): con hash-only, TODOS los avisos del producto se
#      quedan sin estilo.
add_header Content-Security-Policy "base-uri 'self'; form-action 'self' https://www.paypal.com https://*.paypal.com; object-src 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://www.paypal.com\")" always;
# [P2-CSP-ALLOWLIST-TRIM · 2026-08-15] Salen tres permisos que no servian a nadie.
# La Report-Only es el BORRADOR de la enforce: cada origen de mas aqui es un
# origen de mas el dia que se promueva, y nadie lo revisara entonces porque
# "siempre estuvo".
#
#   'unsafe-eval'            -> medido sobre el bundle servido: CERO `eval(` y
#                               CERO `new Function(` en `dist/assets/*.js`.
#   googletagmanager.com     -> no hay GA ni GTM en el proyecto. Existian porque
#   google-analytics.com        `analytics.js` tenia una rama `if (window.gtag)`
#                               que NUNCA pudo ser verdad (nada asigna esa global).
#                               La rama se borro en el mismo pase: el permiso
#                               respaldaba codigo muerto.
#
# `'unsafe-inline'` en script-src SE QUEDA de momento: hay dos bloques inline
# reales (el boot del tema y el head gateado por host de P1-LANDING-HEAD-PRELOAD).
# Sustituirlo por hashes es el paso siguiente, y el del landing cambia en CADA
# build porque lleva los nombres hasheados de los chunks -- por eso el hash tiene
# que calcularlo el deploy desde `dist/index.html`, nunca fijarse a mano.
#
# ─────────────────────────────────────────────────────────────────────────────
# PROMOVER `script-src` A ENFORCE: NO TODAVIA, Y LA FECHA ES CONCRETA.
# [P2-CSP-ENFORCE-ESPERA · 2026-08-15]
#
# El `report-uri` de esta Report-Only se anadio el 2026-08-14. Antes de eso la
# politica llevaba meses SIN COLECTOR: no bloqueaba (es report-only) y tampoco
# informaba, porque las violaciones no llegaban a ningun sitio. O sea que hoy hay
# ~1 dia de datos, no una semana.
#
# El plan de despliegue lo dice y no es burocracia: "Observa 1 semana" existe
# porque el radio de dano de equivocarse aqui es TOTAL. Si el hash del boot de
# tema queda viejo, ese script no ejecuta y vuelve el flash oscuro->papel en las
# 19 rutas; si falta un origen que solo se usa en un camino poco transitado (el
# checkout de PayPal, el ingest de Sentry), se rompe en produccion para quien
# justamente estaba pagando.
#
# QUE HACE FALTA ANTES, en orden:
#   1. A partir del 2026-08-21, revisar las violaciones que hayan llegado a
#      Sentry. Cero violaciones NO es prueba suficiente por si sola -- hay que
#      confirmar que el proyecto de Sentry las esta RECIBIENDO (mandar una a mano
#      desde el navegador), o "cero" puede significar "el colector no funciona".
#   2. El deploy calcula el sha256 de los DOS bloques inline desde `dist/index.html`
#      y los inyecta aqui. Nunca a mano: el del landing cambia en cada build.
#   3. `style-src` se queda en Report-Only aunque script-src pase: `sonner` inyecta
#      un <style> en runtime (`__insertCSS`), asi que con hash-only TODOS los toasts
#      quedarian sin estilo -- y sonner es la capa de feedback entera del producto.
#
# Se deja escrito aqui, y no en un backlog, porque este es el fichero que abrira
# quien vaya a promoverla.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.paypal.com https://www.paypalobjects.com https://*.posthog.com https://*.sentry.io; connect-src 'self' https://*.neon.tech https://*.ingest.sentry.io https://*.sentry.io https://api-m.paypal.com https://*.paypal.com https://*.posthog.com https://api.pwnedpasswords.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src 'self' https://www.paypal.com https://*.paypal.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri https://o4511722960781312.ingest.us.sentry.io/api/4511722995384320/security/?sentry_key=4b132788bcca5aaff5273e31c919be60" always;
