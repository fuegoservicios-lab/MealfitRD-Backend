# v2.bioboros.com — el landing cinematográfico.
#
# Sitio ESTÁTICO puro: un index.html y una carpeta de assets. No proxya nada al
# backend a propósito. Si un día necesita API, se añade el bloque /api/ igual
# que en el server del apex, no se comparte este.
#
# La raíz es un SYMLINK, misma convención que /var/www/bioboros/current
# (P2-DEPLOY-ATOMIC): el despliegue extrae a releases/<ts> y publica moviendo el
# enlace, que nginx resuelve por petición. Rollback = `ln -sfn releases/<ts>
# current`, sin recargar nada.

server {
    listen 80;
    listen [::]:80;
    server_name v2.bioboros.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # SIN `http2`, y es deliberado. Las opciones de protocolo de un puerto son
    # del SOCKET, no del server block: todos los sitios de este VPS comparten el
    # 443, así que ponerlo solo aquí hace que nginx avise de "protocol options
    # redefined" y aplique las del primer bloque de todas formas. Se declara
    # exactamente igual que el apex. Si algún día se quiere http2, se activa
    # para todos los hosts a la vez, no para uno.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name v2.bioboros.com;

    ssl_certificate     /etc/letsencrypt/live/v2.bioboros.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v2.bioboros.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # v2 es ahora un ESPEJO de pruebas del apex: sirve la misma carpeta. Se
    # marca noindex por cabecera y no en el HTML, porque el HTML es literalmente
    # el mismo fichero que sirve bioboros.com y ahí sí tiene que indexarse.
    root /var/www/bioboros-v2/current;
    index index.html;

    include snippets/bioboros-v2-mirror.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # [P3-BROTLI · 2026-08-19] Brotli junto a gzip, no en su lugar.
    #
    # Medido sobre los assets reales de esta release: brotli ahorra un 14,1%
    # frente a gzip-6 (el conjunto que bloquea el primer pintado baja de 147,6 a
    # 127,6 kB). No es espectacular; es gratis y se nota en una conexion mala.
    #
    # Los modulos son los EMPAQUETADOS POR UBUNTU (libnginx-mod-http-brotli-*),
    # no un ngx_brotli compilado a mano: asi suben con nginx en el mismo apt y no
    # existe el modo de fallo de que un upgrade desatendido deje un modulo con la
    # ABI vieja y nginx no arranque. Ese riesgo era el motivo de no ponerlo antes.
    #
    # gzip SE QUEDA: un cliente que no anuncia `br` —y los hay— tiene que seguir
    # recibiendo algo comprimido. `gzip_vary on` de arriba ya emite
    # `Vary: Accept-Encoding`, que es lo que impide que una cache intermedia le
    # sirva brotli a quien no lo entiende.
    #
    # Nivel 5 y no 11: 11 es para pre-comprimir en disco, no para comprimir en
    # cada peticion. `brotli_static on` sirve un .br ya hecho si algun dia se
    # generan en el build; mientras no existan, es inerte.
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_static on;
    brotli_types text/css application/javascript image/svg+xml;
    # `text/html` NO va en la lista: nginx siempre lo comprime y declararlo
    # duplica el tipo y suelta un aviso en cada `nginx -t`.
    gzip_types text/css application/javascript image/svg+xml;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Los sourcemaps nunca se sirven. Aquí no hay ninguno, pero la regla viaja
    # con la convención del servidor por si un futuro build los deja caer.
    location ~ \.map$ { return 404; }

    # El HTML se revalida SIEMPRE. Los nombres de los assets no llevan hash, así
    # que el símil de "immutable" sería mentira: un redespliegue reutiliza los
    # mismos nombres y un caché largo serviría la versión vieja.
    location = / {
        add_header Cache-Control "no-cache";
        include snippets/bioboros-v2-mirror.conf;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/bioboros-v2-mirror.conf;
    }

    # Las fuentes sí son estables: su contenido no cambia sin cambiar de nombre.
    location ^~ /static/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/bioboros-v2-mirror.conf;
        access_log off;
    }

    # Vídeo e imágenes: un día. Suficiente para que una visita repetida no
    # vuelva a bajar 5 MB, corto para que un cambio se vea al día siguiente sin
    # tener que renombrar nada.
    location ^~ /static/ {
        add_header Cache-Control "public, max-age=86400";
        include snippets/bioboros-v2-mirror.conf;
    }

    # Rutas limpias sin extensión: /precios sirve precios.html. Es lo que
    # mantiene las direcciones EXACTAS que el React ya publicaba, sin barra final
    # ni redirecciones que rompan enlaces existentes.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
