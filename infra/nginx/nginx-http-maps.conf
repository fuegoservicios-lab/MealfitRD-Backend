# [P1-CACHE-SOLO-CON-HUELLA · 2026-08-19] Los `map` del bloque http{} de
# /etc/nginx/nginx.conf, que los server blocks de mealfit.conf NECESITAN.
#
# Se versionan aparte porque nginx.conf entero es del sistema (lo gestiona el
# paquete de Ubuntu y lo pisa un upgrade), pero estos dos mapas son NUESTROS y
# sin ellos el sitio no arranca: `$pp_camera` decide la Permissions-Policy por
# host y `$cache_estatico` decide si un asset se cachea un año o cinco minutos.
# Si hay que reconstruir el VPS, esto va al http{} ANTES que los sites.

	#
	# `mealfit-security.conf` lo incluyen los DOS dominios, y llevaba `camera=()`
	# — allowlist VACIA, que desactiva la capacidad aunque el usuario conceda el
	# permiso. Medido en produccion con permiso concedido y camara simulada:
	# `getUserMedia` devolvia `NotAllowedError: Permission denied`. O sea que el
	# escaner de comida y el de la nevera estaban ROTOS, no restringidos.
	#
	# El apex sigue en `()`: es marketing, no pide camara jamas. La app pasa a
	# `(self)`, que es su propio origen y nada mas.
	# [P1-CACHE-SOLO-CON-HUELLA 2026-08-19] `immutable` SOLO si la URL lleva huella.
	#
	# El bloque `/static/` del landing daba un ano de cache inmutable a TODO,
	# apoyandose en que "las URLs ya salen con ?v=<sha>". Medido: 14 no la llevan
	# —las dos familias de fuentes y los once ficheros del hero, que son un
	# <picture> con srcset vivo—. Un nombre estable servido como inmutable es una
	# bomba de relojeria: el dia que cambie el contenido, el visitante recurrente
	# se queda con los bytes viejos hasta un ano y no hay forma de invalidarlo.
	#
	# La regla ya estaba escrita en este mismo servidor para los assets de React
	# ("immutable SOLO para nombres versionados"); esto la extiende al landing en
	# vez de repetir la excepcion.
	#
	# Sin `?v=`: cinco minutos y revalidar. No es gratis —hay un 304 por visita en
	# esos 14 ficheros— y es exactamente el precio de no tener huella en el nombre.
	# Se paga hasta que la lleven.
	map $arg_v $cache_estatico {
		""      "public, max-age=300, must-revalidate";
		default "public, max-age=31536000, immutable";
	}

	map $host $pp_camera {
		default              "()";
		app.bioboros.com     "(self)";
		app.mealfitrd.com    "(self)";
	}

