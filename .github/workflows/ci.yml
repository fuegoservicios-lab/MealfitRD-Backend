# [P2-I18N-CI-HERMANOS-ROJO-PERMANENTE · 2026-08-22] Este workflow es el del REPO BACKEND,
# cuya RAÍZ es el backend. No es el de la raíz del workspace.
#
# Venía siendo una copia del workflow monorepo: pedía `backend/requirements.txt` y
# `frontend/package-lock.json` en un checkout donde ni `backend/` ni `frontend/` existen como
# subdirectorios. Los tres jobs morían en 15 segundos en `Set up Python` / `Set up Node`
# —«No file matched», «Some specified paths were not resolved»— y ni un test llegaba a
# ejecutarse. Medido con `gh run view --log-failed`, no deducido.
#
# Un CI que lleva 44 corridas en rojo sin haber ejecutado nada no es una red: es ruido que
# entrena a ignorar el CI entero, y ahí dentro viven los pytest que anclan que el gate de
# i18n es correcto.
#
# Los jobs de frontend salieron: ese código vive en otro repo, con su propio CI (que sí
# ejecuta, y cuyo gate de i18n está verde). Duplicarlos aquí apuntando a un directorio que no
# existe no es redundancia, es un rojo garantizado.

# [P2-SUPPLY-CHAIN 2026-08-18] Acciones fijadas por SHA, no por tag.
#
# Un tag como `@v4` es un puntero MUTABLE: quien controle el repo de la accion
# puede moverlo, y tu workflow —que corre con acceso al repo y a los secrets—
# ejecutaria codigo distinto sin que cambie una linea aqui. Ha pasado de verdad
# en el ecosistema (tj-actions/changed-files, marzo 2025). Un SHA no se mueve.
#
# El comentario `# vN` de cada linea es a que tag apuntaba ese SHA el dia que se
# fijo. Para actualizarlas: Dependabot abre el PR con el SHA nuevo.
# [P1-LIVE-2 · 2026-05-12] CI gate para MealfitRD.IA.
#
# Hasta que este workflow exista, el repo no tenía ejecución automática de
# tests pre-merge. Toda la red de seguridad (~120+ tests parser-based +
# Vitest frontend) dependía de que el desarrollador invoque pytest/vitest
# manualmente — modo de fallo: refactor lateral (e.g. P1-SCHEDULER-1 quebró
# 5 tests SOP por una línea reformateada) no se detectaba hasta el siguiente
# audit manual.
#
# Este workflow corre 3 jobs en paralelo cuando el repo se conecte a GitHub:
#   1. backend-tests : pytest del bundle parser-based + funcionales.
#   2. frontend-tests: vitest unit + integration.
#   3. frontend-build: vite build production (catch errores de bundle).
#
# Trigger:
#   - push a cualquier branch (gate de regresión continua).
#   - pull_request a main (gate pre-merge).
#
# Política:
#   - main protegido: PR requiere los 3 jobs verde antes de mergear
#     (configurar branch protection rule en GitHub UI tras primer push).
#   - cualquier job rojo bloquea el merge — NO usar "merge anyway" salvo
#     hotfix P0 documentado en PR description con plan de fix-forward.

name: CI

# Permisos MINIMOS. Sin este bloque, el `GITHUB_TOKEN` hereda los del repo, que
# suelen incluir escritura: un workflow que solo necesita leer codigo podria
# empujar commits o publicar releases si algo que ejecuta se tuerce.
permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

# Cancelar runs viejos del mismo branch para no agotar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run pytest (parser-based + functional)
        env:
          # Las suites parser-based no requieren DB real. Las E2E sí, pero
          # se marcan con @pytest.mark.e2e y se pueden filtrar en CI sin DB.
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          # [P2-CI-BACKEND-CERO-TESTS · 2026-08-23] Sin techo de errores de colección:
          # los tests cross-repo resuelven ../frontend mediante fixture y se saltan si el
          # checkout hermano no existe. Así un defecto no vuelve a ocultar toda la suite.
          pytest tests/ -v --tb=short -m "not e2e"

      # [P2-CI-RAIZ-CERO-TESTS · 2026-08-23] Este aviso vivía sólo en el workflow
      # muerto del workspace. Se porta ANTES de retirarlo para que un verde del
      # backend siga distinguiendo «pasó» de «los e2e no se ejecutaron».
      - name: Report unverified e2e count (does not gate)
        if: always()
        run: |
          COUNT=$(pytest tests/ -m "e2e" --collect-only -q 2>/dev/null | tail -1 || echo "?")
          echo "::notice title=E2E sin verificar::Este job corre SIN base de datos, así que los tests marcados @pytest.mark.e2e NO se ejecutan. Recuento: ${COUNT}. Verde aquí NO significa que estén verdes."
