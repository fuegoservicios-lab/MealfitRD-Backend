# [P2-I18N-CI-HERMANOS-ROJO-PERMANENTE · 2026-08-22] Este workflow es el del REPO BACKEND,
# cuya RAÍZ es el backend. No es el de la raíz del workspace.
#
# Venía siendo una copia del workflow monorepo: pedía `backend/requirements.txt` y
# `frontend/package-lock.json` en un checkout donde ni `backend/` ni `frontend/` existen como
# subdirectorios. Los tres jobs morían en 15 segundos en `Set up Python` / `Set up Node`
# —«No file matched», «Some specified paths were not resolved»— y ni un test llegaba a
# ejecutarse. Medido con `gh run view --log-failed`, no deducido.
#
# Un CI que lleva 44 corridas en rojo sin haber ejecutado nada no es una red: es ruido que
# entrena a ignorar el CI entero, y ahí dentro viven los pytest que anclan que el gate de
# i18n es correcto.
#
# Los jobs de frontend salieron: ese código vive en otro repo, con su propio CI (que sí
# ejecuta, y cuyo gate de i18n está verde). Duplicarlos aquí apuntando a un directorio que no
# existe no es redundancia, es un rojo garantizado.

# [P2-SUPPLY-CHAIN 2026-08-18] Acciones fijadas por SHA, no por tag.
#
# Un tag como `@v4` es un puntero MUTABLE: quien controle el repo de la accion
# puede moverlo, y tu workflow —que corre con acceso al repo y a los secrets—
# ejecutaria codigo distinto sin que cambie una linea aqui. Ha pasado de verdad
# en el ecosistema (tj-actions/changed-files, marzo 2025). Un SHA no se mueve.
#
# El comentario `# vN` de cada linea es a que tag apuntaba ese SHA el dia que se
# fijo. Para actualizarlas: Dependabot abre el PR con el SHA nuevo.
# [P1-LIVE-2 · 2026-05-12] CI gate para MealfitRD.IA.
#
# Hasta que este workflow exista, el repo no tenía ejecución automática de
# tests pre-merge. Toda la red de seguridad (~120+ tests parser-based +
# Vitest frontend) dependía de que el desarrollador invoque pytest/vitest
# manualmente — modo de fallo: refactor lateral (e.g. P1-SCHEDULER-1 quebró
# 5 tests SOP por una línea reformateada) no se detectaba hasta el siguiente
# audit manual.
#
# Este workflow corre 3 jobs en paralelo cuando el repo se conecte a GitHub:
#   1. backend-tests : pytest del bundle parser-based + funcionales.
#   2. frontend-tests: vitest unit + integration.
#   3. frontend-build: vite build production (catch errores de bundle).
#
# Trigger:
#   - push a cualquier branch (gate de regresión continua).
#   - pull_request a main (gate pre-merge).
#
# Política:
#   - main protegido: PR requiere los 3 jobs verde antes de mergear
#     (configurar branch protection rule en GitHub UI tras primer push).
#   - cualquier job rojo bloquea el merge — NO usar "merge anyway" salvo
#     hotfix P0 documentado en PR description con plan de fix-forward.

name: CI

# Permisos MINIMOS. Sin este bloque, el `GITHUB_TOKEN` hereda los del repo, que
# suelen incluir escritura: un workflow que solo necesita leer codigo podria
# empujar commits o publicar releases si algo que ejecuta se tuerce.
permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

# Cancelar runs viejos del mismo branch para no agotar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    # [P1-PLAN-LOTE-33 · 2026-09-13] F8: dos patas en paralelo con los mismos pasos. `suite` es el gate de siempre;
    # `produccion` corre `scripts/prod_profile_gate.py`: la suite con los knobs del `.env` del VPS exportados (menos
    # `tests/prod_profile_excluded.txt`, cada línea con su motivo) + la batería. En serie no cabían en los 50 min.
    name: Backend pytest (${{ matrix.perfil }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perfil: [suite, produccion]
    # [P0-CI-TIMEOUT-15 · 2026-09-11] Eran 15 min y la suite completa (24.361 tests sin e2e, en
    # serie y con `-v`) tarda más: TODAS las corridas desde el 2026-09-09 acababan `cancelled` por
    # «exceeded the maximum execution time» — dos por push (main + glm-migration), ~32 min de
    # runner y CERO veredictos. Un gate que nunca termina no gatea nada. Ahora corre como el gate
    # local (`scripts/run_ci.ps1`): xdist con `--dist loadfile` (los tests dependientes del orden
    # viven en el mismo fichero), cuarentena en serie, y techo holgado para el runner de 2 vCPU.
    # [P1-PLAN-LOTE-33 · 2026-09-13] 50 → 90 min, y se QUEDAN los 2 workers: la suite volvió a pasar de los 50 min (las 9
    # corridas desde el lote 26 murieron `cancelled` con el paso de pytest en 49,4 min: cero veredictos otra vez). Probado
    # subir los workers: `-n 4` murió con exit 143 a los 90 s de arrancar, `-n 3` con «The runner has received a shutdown
    # signal» a los 17 min — cuantos más workers, antes muere: la memoria del runner es el límite, no la CPU.
    # [P1-PLAN-LOTE-33 (bis 4) · 2026-09-13] 90 → 120: las dos patas llegan al 99 % en 13-40 min y la suite tarda luego
    # 45-64 min más en cerrar (la de producción, 19 min o colgada hasta el techo). Es UN test lento sólo en Linux, sin
    # nombre todavía: `--durations` lo nombra en la próxima corrida. El techo es margen, no el arreglo.
    timeout-minutes: 120
    env:
      # [P1-I18N-CI-SIN-VEREDICTO] `secrets.*` no se evalúa dentro de un `if` de step; aquí
      # sí, y la condición del checkout del hermano lee esta variable.
      HAS_SIBLING_TOKEN: ${{ secrets.SIBLING_REPO_TOKEN != '' }}
    steps:
      # [P1-I18N-CI-SIN-VEREDICTO · 2026-08-23] El backend se clona en `backend/` y NO en
      # la raíz del runner, para reproducir la disposición HERMANA del workspace:
      #
      #     <raíz>/backend/tests/test_x.py   ->  Path(__file__).parents[2] == <raíz>
      #     <raíz>/frontend/src/...
      #
      # MEDIDO: 400 de los 1.932 tests del backend (20 %) construyen una ruta a
      # `frontend/src` por esa vía, y 55 de los 96 guards de idiomas entre ellos. En un
      # checkout solo-backend fallaban en COLECCIÓN con FileNotFoundError, y como el job
      # llevaba `--maxfail=25`, moría a los 25 errores sin ejecutar UN test — el CI del
      # backend llevaba semanas en rojo sin veredicto, y entre lo que no corría estaba el
      # P0 clínico de alérgenos.
      - name: Checkout backend (como hermano, en backend/)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          path: backend

      # El repo del frontend es PRIVADO y el GITHUB_TOKEN de este job no lo alcanza: hace
      # falta un PAT con `contents:read` sobre fuegoservicios-lab/MealfitRD en el secret
      # `SIBLING_REPO_TOKEN`. Sin él, este paso se SALTA y el de abajo lo dice en el
      # resumen del job en vez de fingir cobertura — la degradación tiene que verse.
      # `secrets.*` NO se puede leer en un `if` de step (GitHub lo deja vacío ahí): se pasa
      # por `env` del job y la condición mira la variable. Es la forma documentada.
      # [P2-CI-BACKEND-SIBLINGS · 2026-09-04] El repo del frontend es PÚBLICO: el checkout no
      # necesita token, así que los ~400 tests de paridad que leen `../frontend/src` corren SIEMPRE
      # (antes solo con `SIBLING_REPO_TOKEN`, que nunca se definió: 1.412 tests rojos por construcción).
      - name: Checkout frontend (hermano, en frontend/)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: fuegoservicios-lab/MealfitRD
          path: frontend
      # `migrations/` del workspace raíz es una copia SSOT idéntica a `backend/migrations/`
      # (P3-MIGRATIONS-SSOT): los tests que leen `parents[2] / "migrations"` resuelven por el enlace.
      - name: migrations/ raíz = backend/migrations (SSOT)
        run: ln -s backend/migrations migrations && ls migrations | wc -l
      # Varios tests del backend SONDEAN los scripts de node del frontend (i18n-check, gates de
      # copy): necesitan `frontend/node_modules`. Sin scripts de instalación: solo dependencias.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Deps del frontend (para los tests que ejecutan sus scripts de node)
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      # El workspace raíz (CLAUDE.md, docs/) es PRIVADO: solo con `SIBLING_REPO_TOKEN`. Sin él, los
      # tests que leen CLAUDE.md se saltan (conftest, con conteo visible), no fallan.
      - name: Checkout workspace raíz (CLAUDE.md, docs/) si hay token
        if: ${{ env.HAS_SIBLING_TOKEN == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: fuegoservicios-lab/MealfitRD-Workspace
          token: ${{ secrets.SIBLING_REPO_TOKEN }}
          path: workspace
      - name: Traer CLAUDE.md y docs/ del workspace si se descargó
        if: ${{ env.HAS_SIBLING_TOKEN == 'true' }}
        run: |
          cp workspace/CLAUDE.md CLAUDE.md
          [ -d workspace/docs ] && cp -r workspace/docs docs || true

      - name: Declarar qué hermanos están (la degradación, visible)
        run: |
          {
            echo "## Hermanos en este checkout"
            [ -d frontend/src ] && echo "- frontend: presente (repo público) — corren los tests de paridad que leen \`frontend/src\`." || echo "- ⚠️ frontend: AUSENTE."
            [ -d migrations ] && echo "- migrations/: enlace a backend/migrations (copia SSOT)." || echo "- ⚠️ migrations/: ausente."
            if [ -f CLAUDE.md ]; then echo "- workspace (CLAUDE.md, docs/): presente vía SIBLING_REPO_TOKEN."; else echo "- ⚠️ workspace (CLAUDE.md, docs/): AUSENTE — el repo es privado y no hay \`SIBLING_REPO_TOKEN\`; los tests que leen CLAUDE.md se SALTAN (ver conteo de pytest), no se ejecutan."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-xdist

      - name: Run pytest (parser-based + functional)
        working-directory: backend
        env:
          # Las suites parser-based no requieren DB real. Las E2E sí, pero
          # se marcan con @pytest.mark.e2e y se pueden filtrar en CI sin DB.
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
          # [P1-PLAN-LOTE-33 (bis 4) · 2026-09-13] Los 30 tests más lentos al cierre de cada pata. La de la suite pasó del
          # 99 % a los 12 min y tardó 64 más en cerrar sin decir quién: sin nombre no hay arreglo, sólo techos más altos.
          PYTEST_ADDOPTS: "--durations=30"
        run: |
          # [P2-CI-BACKEND-CERO-TESTS · 2026-08-23] Sin techo de errores de colección:
          # los tests cross-repo resuelven ../frontend mediante fixture y se saltan si el
          # checkout hermano no existe. Así un defecto no vuelve a ocultar toda la suite.
          #
          # [P1-I18N-CI-SIN-VEREDICTO · 2026-08-23] Y con el checkout del hermano de arriba
          # (secret `SIBLING_REPO_TOKEN`), esos mismos tests DEJAN de saltarse y corren de
          # verdad — los 400, incluido el P0 clínico de alérgenos. Las dos piezas se
          # complementan: el fixture es la degradación legible cuando falta el secret; el
          # checkout es lo único que hace que lleguen a ejecutarse en Actions alguna vez.
          # [P0-CI-TIMEOUT-15 · 2026-09-11] Misma receta que `scripts/run_ci.ps1` (fase A en
          # paralelo + cuarentena en serie). Sin `-v`: 24k líneas de log no son un veredicto.
          export PYTHONHASHSEED=0
          if [ "${{ matrix.perfil }}" = "produccion" ]; then
            # [P1-PLAN-LOTE-33] el perfil de producción (la cuarentena la lee el script de este mismo fichero)
            python scripts/prod_profile_gate.py --workers 2
            exit $?
          fi
          QUARANTINE="tests/test_chunked_generation.py tests/test_renewal_15d.py tests/test_p1_17_purge_graph_cache.py tests/test_p1_audit_hist_7_lesson_whitelist_ssot.py tests/test_p1_bg_thread_timeout.py tests/test_p2_cap_log_level.py"
          IGNORE=""; for f in $QUARANTINE; do IGNORE="$IGNORE --ignore $f"; done
          pytest tests/ -q --tb=short -m "not e2e" -n 2 --dist loadfile --max-worker-restart=4 $IGNORE
          pytest $QUARANTINE -q --tb=short -m "not e2e" -p no:cacheprovider

      # [P2-E2E-CATALOGO-PAIS-SIN-NINGUN-GATE · 2026-08-23] Sólo el fichero
      # read-only que contrasta el catálogo vivo. Nunca `-m e2e` sobre toda la
      # suite: ese marker también es la llave que autoriza escrituras de tests.
      - name: Country catalog live (read-only)
        if: ${{ matrix.perfil == 'suite' }}
        working-directory: backend
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MEALFIT_COUNTRY_SYSTEM: "true"
        run: |
          if [ -z "${NEON_DATABASE_URL:-}" ]; then
            echo "::notice title=Catálogo vivo no verificado::NEON_DATABASE_URL no está configurada; se omite el subconjunto read-only de países."
            exit 0
          fi
          pytest tests/test_p1_country_system_f2.py -m "e2e" -q --tb=short

      # [P2-CI-RAIZ-CERO-TESTS · 2026-08-23] Este aviso vivía sólo en el workflow
      # muerto del workspace. Se porta ANTES de retirarlo para que un verde del
      # backend siga distinguiendo «pasó» de «los e2e no se ejecutaron».
      - name: Report unverified e2e count (does not gate)
        working-directory: backend
        if: always()
        run: |
          # [P1-PLAN-LOTE-33] el aviso lo da la pata de la suite: la de producción no lo repite
          [ "${{ matrix.perfil }}" = "suite" ] || exit 0
          COUNT=$(pytest tests/ -m "e2e" --collect-only -q 2>/dev/null | tail -1 || echo "?")
          echo "::notice title=E2E sin verificar::Este job corre SIN base de datos, así que los tests marcados @pytest.mark.e2e NO se ejecutan. Recuento: ${COUNT}. Verde aquí NO significa que estén verdes."
